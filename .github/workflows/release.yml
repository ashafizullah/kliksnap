name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read this version's changelog
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v h="## $version" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app ships the matching public key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KlikSnap ${{ github.ref_name }}
          # The app's update dialog shows this up to "## Download".
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            ## Download

            **macOS** (Apple Silicon + Intel): run this in Terminal to install or reinstall:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/ashafizullah/kliksnap/main/install.sh | bash
            ```
            Or download `KlikSnap_*_universal.dmg`, open it and drag KlikSnap into Applications. The app isn't notarized, so macOS blocks it the first time: go to System Settings → Privacy & Security → **Open Anyway**, or run `xattr -cr /Applications/KlikSnap.app`.

            **Windows**: download `KlikSnap_*_x64-setup.exe` (or the `.msi`).
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
