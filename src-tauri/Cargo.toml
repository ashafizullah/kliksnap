[package]
name = "kliksnap"
version = "0.1.0"
description = "Free, open-source, lightweight screenshot tool"
authors = ["KlikSnap contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "kliksnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
