<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4F8DFF"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1E4A" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06205E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#soft)" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <!-- viewfinder corners -->
    <path d="M292 452 V340 a48 48 0 0 1 48 -48 H452"/>
    <path d="M572 292 H684 a48 48 0 0 1 48 48 V452"/>
    <path d="M732 572 V684 a48 48 0 0 1 -48 48 H572"/>
    <path d="M452 732 H340 a48 48 0 0 1 -48 -48 V572"/>
  </g>

  <!-- shutter "click" -->
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="78" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="34" fill="#2563EB"/>
  </g>
</svg>
