name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          # xcap needs PipeWire 1.0 headers, which 22.04 lacks.
          - platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read this version's changelog
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v h="## $version" '$0 == h {on=1; next} on && /^## / {exit} on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; the app ships the matching public key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KlikSnap ${{ github.ref_name }}
          # The app's update dialog shows this up to "## Download".
          releaseBody: |
            ${{ steps.changelog.outputs.notes }}

            ## Download

            **macOS** (Apple Silicon + Intel): run this in Terminal to install or reinstall:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/ashafizullah/kliksnap/main/install.sh | bash
            ```
            Or download `KlikSnap_*_universal.dmg`, open it and drag KlikSnap into Applications. The app isn't notarized, so macOS blocks it the first time: go to System Settings → Privacy & Security → **Open Anyway**, or run `xattr -cr /Applications/KlikSnap.app`.

            **Windows**: download `KlikSnap_*_x64-setup.exe` (or the `.msi`).

            **Linux** (beta, x86_64): download the `.deb` (Ubuntu, Debian), `.rpm` (Fedora) or `.AppImage` (any distro; `chmod +x` it first). Copy Text needs `tesseract-ocr` and recording needs `ffmpeg`. Recording and global shortcuts work on X11 only; on Wayland, bind `kliksnap --capture area` (or `window`, `screen`, `text`) to a keyboard shortcut in your desktop settings.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
