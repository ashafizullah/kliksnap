name: Bug report
description: Something in KlikSnap doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the [existing issues](https://github.com/ashafizullah/kliksnap/issues) first. For security problems, use [Report a vulnerability](https://github.com/ashafizullah/kliksnap/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
      placeholder: Scrolling capture stops after the first screen in Chrome on Windows.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KlikSnap version
      description: The release you installed, e.g. from the DMG or installer file name.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (beta)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.5 (Apple Silicon) / Windows 11 24H2 / Ubuntu 24.04
  - type: input
    id: desktop
    attributes:
      label: Display setup
      description: Number of monitors and scaling, and on Linux the desktop environment and X11 or Wayland.
      placeholder: 2 monitors (100% and 150%), GNOME 46 on Wayland
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Error messages or logs. Remove anything private from screenshots first.
