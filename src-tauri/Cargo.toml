[package]
name = "kliksnap"
version = "0.10.1"
description = "Free, open-source, lightweight screenshot tool"
authors = ["KlikSnap contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "kliksnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
# JPEG export; unifies with the image crate xcap re-exports.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
gif = "0.14"
sys-locale = "0.3"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-updater = "2.13.2"
tauri-plugin-single-instance = "2.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6.2"
dispatch2 = "0.3"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "block2"] }
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rqrr = { version = "0.11.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections", "ApplicationModel_DataTransfer", "Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Performance"] }
windows-collections = "0.3.2"
windows-capture = "2.0.1"
cpal = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
